  note_label: Current Energy Performance Rating
- name: CURRENT_ENERGY_PERFORMANCE_BAND
  attribution: note
  note_name: CURRENT_ENERGY_PERFORMANCE_BAND
  scotland_only: false
  page: 8
  text: Reports ‘Current Energy Performance Rating’ on a scale of A+ to G with A+ (0 or lower) being best and G
