# What each column is, for the data dictionary and the provenance site. Generated by
# tools/extract_note_dictionary.py from the pinned publication note (attribution: note, with the
# page), then reviewed by eye (the `review` block). The key and derived columns are described by
# the project (attribution: project), with the text of epc_nd_ingest/columns.py. Regenerate for a
# new note or a changed column description, then review again.
version: 1
note:
  file: epc_nondomestic_2026Q3/publication_note.pdf
  sha256: 123fcfc73ecf79d3f7d16ddf78aad87167f81865dc6116cb3566b9f44b7d4e24
  title: Non-domestic EPC extended historic data publication note, Q3 2026 extract, Scottish Government
  licence: Open Government Licence v3.0; quoted with attribution
review:
  date: '2026-11-14'
  by: Michele Tinti with Claude Fable 5.2 (AI-assisted)
  record: docs/reviews/2026-11-14-column-descriptions.md
  method: Every note entry compared with the extracted text of the pinned PDF, page by page. Labels cut at the seams
    by the exact phrases typed from the PDF. The committed file is compared with a fresh extraction by --check.
  notes:
    MEETS_2002_STANDARD: The entry starts on page 8 and ends on page 9. The page given is where it starts.
    OSG_REFERENCE_NUMBER: The note says 9 to 12 digits. The file holds 8-digit values too.
    CURRENT_ENERGY_PERFORMANCE_BAND: The note says A+ is 0 or lower. In the file a rating below 0 has the band 'Carbon
      Neu', a value the note does not list.
    POTENTIAL_ENERGY_PERFORMANCE_RATING: The note's section on 'data removed' says when this field holds that text.
    CONSTITUENCY: 'The entry''s wording is the publisher''s: the field holds the ward code.'
    REPORT_REFERENCE_NUMBER: '''of and EPC'' is the note''s text.'
    INSPECTION_DATE: '''energy performance of the building was undertaken'' is the note''s text.'
columns:
- name: epc_release
  attribution: project
  text: The release of the extract this row came from, 2026Q3. A later release is a new build.
- name: source_row
  attribution: project
  text: 'The row''s position in the pinned file: 1 for the first data row, which is file row 3 after the two header
    rows. The file is in no order, so the number identifies a row of this release and nothing else.'
- name: HISTORIC
  attribution: note
  note_name: HISTORIC
  scotland_only: false
  page: 7
  text: Flag to indicate if EPC has been superseded or not. Further detail available above in the section ‘Revised
    dataset extents’,
  note_label: Historical
- name: BUILDING_REFERENCE_NUMBER
  attribution: note
  note_name: BUILDING_REFERENCE_NUMBER
  scotland_only: false
  page: 7
  text: Unique 10-digit identifier for the property, generated by the SEPCR to enable the EPC lodgement process
    even where there is no current matching UPRN for the assessed property extents (building or building unit).
    Not the same as the Unique Property Reference Number available from the One Scotland Gazetteer.
  note_label: Property UPRN
- name: OSG_REFERENCE_NUMBER
  attribution: note
  note_name: OSG_REFERENCE_NUMBER
  scotland_only: true
  page: 7
  text: Unique 9-12-digit property reference number assigned to a building by local authority data custodians and
    recorded centrally on the One Scotland Gazetteer – OSG | One Scotland Gazetteer.
  note_label: OSG UPRN
