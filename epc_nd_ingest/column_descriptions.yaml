  note_label: Energy Band
- name: POTENTIAL_ENERGY_PERFORMANCE_RATING
  attribution: note
  note_name: POTENTIAL_ENERGY_PERFORMANCE_RATING
  scotland_only: false
  page: 8
  text: 'Building Energy Performance Rating for the building if identified improvements are carried out, reported
    as the calculated emissions for the building. (Units: kg of CO2 per m2 per year).'
  note_label: Potential Energy Performance Rating
- name: POTENTIAL_ENERGY_PERFORMANCE_BAND
  attribution: note
  note_name: POTENTIAL_ENERGY_PERFORMANCE_BAND
  scotland_only: false
  page: 8
  text: Reports ‘Potential Energy Performance Rating’ on a scale of A+ to G with A+ (0 or lower) being best and
    G (100+) being worst.
  note_label: Potential Band
- name: NEW_BUILD_ENERGY_PERFORMANCE_RATING
  attribution: note
  note_name: NEW_BUILD_ENERGY_PERFORMANCE_RATING
  scotland_only: false
  page: 8
  text: 'The Energy Performance Rating for the building if constructed to meet the building regulations current
    at the date of assessment, reported as the calculated emissions for the building. (Units: kg of CO2 per m2 per
    year).'
  note_label: New Build Benchmark Rating
- name: NEW_BUILD_ENERGY_PERFORMANCE_BAND
  attribution: note
  note_name: NEW_BUILD_ENERGY_PERFORMANCE_BAND
  scotland_only: false
  page: 8
  text: Reports the New Build Benchmark Rating on a scale of A+ to G with A+ (0 or lower) being best and G (100+)
    being worst.
  note_label: New Build Benchmark Band
- name: MEETS_2002_STANDARD
  attribution: note
  note_name: MEETS_2002_STANDARD
  scotland_only: false
  page: 8
  text: 'Reports whether the building would meet the energy standards applicable to a building constructed to the
    2002 energy standards. Use to demonstrate one exemption under The Energy Assessment of Non-domestic Buildings
    (Scotland) Regulations 2016 (see: Improving the building stock - Building standards - gov.scot (www.gov.scot)).
    Note: this data element is not reported in records lodged prior to 20 March 2016.'
  note_label: Compliant 2002
- name: ASSET_RATING
  attribution: note
  note_name: ASSET_RATING
  scotland_only: false
  page: 9
  text: 'Reports on the asset rating of the building if assessed using Scottish weather data and the additional
    ratings methodology applied for the production of EPCs in England & Wales. Note: introduced to provide a reporting
    measure for the UK Government Feed-in Tariff.'
  note_label: Comparative Asset Rating
- name: ASSET_RATING_BAND
  attribution: note
  note_name: ASSET_RATING_BAND
  scotland_only: false
  page: 9
  text: 'Reports the Comparative Asset Rating on a scale of A+ to G with A+ (0 or lower) being best and G (100+)
    being worst. Note: introduced to provide a reporting measure for the UK Government Feed-in Tariff.'
  note_label: Comparative Energy Band
- name: BUILDING_EMISSIONS
  attribution: note
  note_name: BUILDING_EMISSIONS
  scotland_only: false
  page: 9
  text: '‘Building Emission Rate.’ The calculated emissions for the building, presented as a whole number in ‘Current
    Energy Performance Rating.’ (Units: kg of CO2 per m² per year).'
  note_label: EPC Rating BER
- name: RENEWABLE_SOURCES
  attribution: note
  note_name: RENEWABLE_SOURCES
  scotland_only: false
  page: 9
  text: 'Recorded where a low or zero carbon technology (equipment that either generates or otherwise provides energy
    with no or little resulting emissions) is present in the building. Examples include photovoltaic panels, heat
    pumps and wind turbines. Note: ‘other, non-calculated’ indicates a renewable energy source but benefit that
    cannot be calculated within SBEM.'
  note_label: Renewable Energy Source
- name: ELECTRICITY_SOURCE
  attribution: note
  note_name: ELECTRICITY_SOURCE
  scotland_only: false
  page: 9
  text: Identifies whether electricity supplied to the building is from the national grid or from another source.
  note_label: Electricity_Source
- name: MAIN_HEATING_FUEL
  attribution: note
  note_name: MAIN_HEATING_FUEL
  scotland_only: false
  page: 10
  text: Reports the fuel type used by the main heating system present in the building.
  note_label: Main Heating Fuel
- name: BUILDING_ENVIRONMENT
  attribution: note
  note_name: BUILDING_ENVIRONMENT
  scotland_only: false
  page: 10
  text: Reports on the type and extent of ventilation system used within the building.
  note_label: Building Environment
- name: PRIMARY_ENERGY_VALUE
  attribution: note
  note_name: PRIMARY_ENERGY_VALUE
  scotland_only: false
  page: 10
  text: 'The amount of energy required at source, before conversion, to meet the calculated energy demand of the
    existing building (Units: kWh/m²/year). Note: calculated by applying primary energy factors to the total energy
    use for each fuel used in the building.'
  note_label: Actual Building Data Primary Energy Indicator
- name: APPROXIMATE_ENERGY_USE
  attribution: note
  note_name: APPROXIMATE_ENERGY_USE
  scotland_only: false
  page: 10
  text: 'The calculated total energy use for the building (energy demand minus energy generated on site). (Units:
    kWh/m²/year). Note: used, together with carbon factors for fuels to calculate the building emissions (‘Current
    Energy Performance Rating’ and ‘BER’).'
  note_label: Actual Building Data Approx Energy Use
- name: IMPROVEMENT_RECOMMENDATIONS
  attribution: note
  note_name: IMPROVEMENT_RECOMMENDATIONS
  scotland_only: false
  page: 10
  text: 'A list of the improvement measures identified as relevant to the building at the date of assessment. These
    measures are either standard measures drawn from Annex B5.0 of the SBEM Technical Manual or are created by the
    EPC Assessor. Improvement measures are listed sequentially under a single data entry in the following format:
    ‘Measure code; CO2 impact; Payback Type; Description.’ Each measure is separated by a vertical line [ “|” -
    ASCII (decimal) 124]'
  note_label: Recommendations
- name: LOCAL_AUTHORITY
  attribution: note
  note_name: LOCAL_AUTHORITY
  scotland_only: false
  page: 10
  text: The code of the local authority area in which the building is located.
  note_label: Local Authority Identifier
- name: DATA_ZONE
  attribution: note
  note_name: DATA_ZONE
  scotland_only: false
  page: 11
  text: Data Zone code and name - Data zones are the key geography for the dissemination of small area statistics
    in Scotland.
  note_label: Data Zone
- name: CONSTITUENCY
  attribution: note
  note_name: CONSTITUENCY
  scotland_only: false
  page: 11
  text: Code for Parliamentary constituency in which the building is located. Scottish area defined as 'Ward', not
    'constituency'
  note_label: Ward Code
- name: CONSTITUENCY_LABEL
  attribution: note
  note_name: CONSTITUENCY_LABEL
  scotland_only: false
  page: 11
  text: Name of Parliamentary constituency in which the building is located. Scottish area defined as 'Ward', not
    'constituency'
  note_label: Ward Name
- name: TRANSACTION_TYPE
  attribution: note
  note_name: TRANSACTION_TYPE
  scotland_only: false
  page: 11
  text: Purpose for which assessment was carried out, as declared by building owner/commissioning party. • Mandatory
    issue (Marketed sale) • Mandatory issue (Non-marketed sale) • Mandatory issue (Property on construction) • Mandatory
    issue (Property to let) • Mandatory issue (Display in public building) (option added in 2016) • Voluntary (No
    legal requirement for an EPC) • Voluntary re-issue (A valid EPC is already lodged)
  note_label: Transaction Type
- name: TARGET_EMISSIONS
  attribution: note
  note_name: TARGET_EMISSIONS
  scotland_only: false
  page: 11
  text: '‘Target Emission Rate.’ The calculated emissions for the same building, if newly constructed to the building
    regulations applicable at the date of assessment. (Units: kg of CO2 per m² per year).'
  note_label: EPC Rating TER
- name: DATA_ZONE_2011
  attribution: note
  note_name: DATA_ZONE_2011
  scotland_only: false
  page: 11
  text: Data zones from 2011, representing small areas across Scotland of around 500 – 1,000 household residents.
  note_label: Data Zone 2011
- name: CREATED_AT
  attribution: note
  note_name: CREATED_AT
  scotland_only: false
  page: 11
  text: The date and time that the certificate was lodged on the register.
  note_label: Lodgement Date
- name: REPORT_REFERENCE_NUMBER
  attribution: note
  note_name: REPORT_REFERENCE_NUMBER
  scotland_only: false
  page: 12
  text: Unique, auto-generated number produced on the lodgement of and EPC to the SEPCR.
  note_label: RRN
- name: rrn
  attribution: project
  text: The report reference number as published where not empty, NULL where empty (126 rows). Unique where present.
- name: uprn_sepcr
  attribution: project
  text: The register's own 10-digit number for the building, trimmed and as an integer. Not the Gazetteer UPRN.
    Present in every row.
- name: uprn_osg
  attribution: project
  text: The One Scotland Gazetteer UPRN as an integer, NULL where the published cell is empty (35.4% of rows). The
    only column a UPRN join compares. A padded cohort UPRN matches once cast to bigint.
- name: pc_norm
  attribution: project
  text: POSTCODE in upper case with every space and tab removed. NULL where nothing is left. Nothing repaired. The
    postcode join normalises the cohort postcode by the same rule.
- name: datazone_2001
  attribution: project
  text: The 2001 data zone code when DATA_ZONE starts with S01 and six digits followed by a space or the end, otherwise
    NULL.
- name: datazone_2001_status
  attribution: project
  text: code, empty, not_a_datazone (for 00QQMB and the like) or unknown_code (well formed, not in the pinned list.
    The build fails if any).
- name: datazone_2011
  attribution: project
  text: The 2011 data zone code by the same rule, otherwise NULL.
- name: datazone_2011_status
  attribution: project
  text: As datazone_2001_status, for the 2011 column.
- name: inspection_date_parsed
  attribution: project
  text: 'INSPECTION_DATE (yyyy-mm-dd) as a date: the day the assessor saw the building. The dated joins choose the
    certificate by it. Outliers (2002 to 2108) are kept as published. A value that does not parse stops the build.'
- name: lodgement_date_parsed
  attribution: project
  text: LODGEMENT_DATE (yyyy-mm-dd) as a date. The administrative date of the certificate, a median of 8 days after
    the inspection. The ten-year validity runs from it.
- name: created_at_parsed
  attribution: project
  text: 'CREATED_AT (dd/mm/yyyy hh:mm:ss) as a timestamp to the second: when the certificate was lodged on the register.
    Never later than the last day of the release quarter.'
- name: historic_flag
  attribution: project
  text: 1 where HISTORIC is True (the certificate has been superseded), 0 where False. Any other value stops the
    build.
- name: floor_area_int
  attribution: project
  text: The conditioned floor area of the building in square metres as an integer, 4 to 138,037 in this release.
    Shared with dwellings in unit, not in what is measured.
- name: current_energy_performance_rating_int
  attribution: project
  text: 'The current energy performance rating as an integer: calculated emissions in kg of CO2 per square metre
    per year, lower is better, negative allowed. Not the domestic rating, which scores energy cost and where higher
    is better.'
- name: potential_energy_performance_rating_num
  attribution: project
  text: The potential energy performance rating (kg of CO2 per square metre per year after the listed improvements)
    as decimal(19,4). NULL exactly where the published text is 'Data removed' (1,712 rows).
- name: building_emissions_num
  attribution: project
  text: The Building Emission Rate (kg of CO2 per square metre per year) as decimal(19,4). The same quantity as
    the domestic emissions per floor area.
- name: primary_energy_value_int
  attribution: project
  text: The primary energy indicator (kWh per square metre per year) as an integer. The same quantity as the domestic
    primary energy indicator.
