  note_label: Total floor area
- name: CURRENT_ENERGY_PERFORMANCE_RATING
  attribution: note
  note_name: CURRENT_ENERGY_PERFORMANCE_RATING
  scotland_only: false
  page: 8
  text: 'Building Energy Performance Rating for the actual building, reported as the calculated emissions for the
