- name: uprn_sepcr
  type: int64
  nullable: false
  source: BUILDING_REFERENCE_NUMBER
  description: The register's own 10-digit number for the building, trimmed and as an integer. Not the Gazetteer UPRN. Present
    in every row.
  group: derived
- name: uprn_osg
  type: int64
  nullable: true
  source: OSG_REFERENCE_NUMBER
  description: The One Scotland Gazetteer UPRN as an integer, NULL where the published cell is empty (35.4% of rows). The
    only column a UPRN join compares. A padded cohort UPRN matches once cast to bigint.
  group: derived
- name: pc_norm
  type: string
  width: 32
  nullable: true
  source: POSTCODE
  description: POSTCODE in upper case with every space and tab removed. NULL where nothing is left. Nothing repaired. The
    postcode join normalises the cohort postcode by the same rule.
  group: derived
- name: datazone_2001
  type: string
  width: 9
  nullable: true
  source: DATA_ZONE
  description: The 2001 data zone code when DATA_ZONE starts with S01 and six digits followed by a space or the end, otherwise
    NULL.
  group: derived
- name: datazone_2001_status
  type: string
  width: 16
  nullable: false
  source: DATA_ZONE
  description: code, empty, not_a_datazone (for 00QQMB and the like) or unknown_code (well formed, not in the pinned list.
    The build fails if any).
  group: derived
- name: datazone_2011
  type: string
  width: 9
  nullable: true
  source: DATA_ZONE_2011
  description: The 2011 data zone code by the same rule, otherwise NULL.
  group: derived
- name: datazone_2011_status
  type: string
  width: 16
  nullable: false
  source: DATA_ZONE_2011
  description: As datazone_2001_status, for the 2011 column.
  group: derived
- name: inspection_date_parsed
  type: date
  nullable: false
  source: INSPECTION_DATE
  description: 'INSPECTION_DATE (yyyy-mm-dd) as a date: the day the assessor saw the building. The dated joins choose the
    certificate by it. Outliers (2002 to 2108) are kept as published. A value that does not parse stops the build.'
  group: derived
- name: lodgement_date_parsed
  type: date
  nullable: false
  source: LODGEMENT_DATE
  description: LODGEMENT_DATE (yyyy-mm-dd) as a date. The administrative date of the certificate, a median of 8 days after
    the inspection. The ten-year validity runs from it.
  group: derived
- name: created_at_parsed
  type: datetime
  nullable: false
  source: CREATED_AT
  description: 'CREATED_AT (dd/mm/yyyy hh:mm:ss) as a timestamp to the second: when the certificate was lodged on the register.
    Never later than the last day of the release quarter.'
  group: derived
- name: historic_flag
  type: bool
  nullable: false
  source: HISTORIC
  description: 1 where HISTORIC is True (the certificate has been superseded), 0 where False. Any other value stops the build.
  group: derived
- name: floor_area_int
  type: int32
  nullable: false
  source: FLOOR_AREA
  description: The conditioned floor area of the building in square metres as an integer, 4 to 138,037 in this release. Shared
    with dwellings in unit, not in what is measured.
  group: derived
- name: current_energy_performance_rating_int
  type: int32
  nullable: false
  source: CURRENT_ENERGY_PERFORMANCE_RATING
  description: 'The current energy performance rating as an integer: calculated emissions in kg of CO2 per square metre per
    year, lower is better, negative allowed. Not the domestic rating, which scores energy cost and where higher is better.'
  group: derived
- name: potential_energy_performance_rating_num
  type: decimal
  nullable: true
  source: POTENTIAL_ENERGY_PERFORMANCE_RATING
  description: The potential energy performance rating (kg of CO2 per square metre per year after the listed improvements)
    as decimal(19,4). NULL exactly where the published text is 'Data removed' (1,712 rows).
  group: derived
- name: building_emissions_num
  type: decimal
  nullable: false
  source: BUILDING_EMISSIONS
  description: The Building Emission Rate (kg of CO2 per square metre per year) as decimal(19,4). The same quantity as the
    domestic emissions per floor area.
  group: derived
- name: primary_energy_value_int
  type: int32
  nullable: false
  source: PRIMARY_ENERGY_VALUE
  description: The primary energy indicator (kWh per square metre per year) as an integer. The same quantity as the domestic
    primary energy indicator.
  group: derived
