# superscript 2), and the longest value measured over all 95,719 rows of release 2026Q3
# (docs/profile_2026-11-14.txt). python -m epc_nd_ingest.columns turns this into
# output_schema.yaml. Pinned 14 November 2026; a later release with a different header fails the build.
